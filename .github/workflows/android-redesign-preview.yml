name: NEXUS Android redesign preview

on:
  push:
    branches:
      - feature/nexus-redesign-v1.3.0
    paths:
      - "android/**"
      - ".github/workflows/android-redesign-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble NEXUS 1.3.0 preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Android-v1.3.0-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

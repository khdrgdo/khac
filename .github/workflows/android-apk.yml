name: NEXUS Android APK

on:
  push:
    branches:
      - feature/android-v1.2.0
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "README-ANDROID.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android 1.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Android-v1.2.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-android-v1.2.0
          target_commitish: feature/android-v1.2.0
          name: NEXUS Android 1.2.0 — Test Build
          body: |
            NEXUS native Android student app v1.2.0.
            Includes the first native student community feed, anonymous posts and comments.
            Built with Kotlin and Jetpack Compose. Debug-signed test APK; not a Play Store release.
          draft: false
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

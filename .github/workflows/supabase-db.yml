name: Supabase database validation

on:
  push:
    branches:
      - main
      - feat/android-v1.0.0-foundation
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-db.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Reset, migrate and test local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase services
        run: supabase start --exclude studio,edge-runtime,logflare,vector

      - name: Apply every migration from an empty database
        run: supabase db reset --local

      - name: Run database contract tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

name: Android CI

on:
  push:
    branches:
      - main
      - feat/android-v1.0.0-foundation
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          "$SDKMANAGER" --licenses <<'LICENSES'
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          LICENSES
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Inspect Lifecycle dependency resolution
        run: bash ./gradlew --no-daemon :app:dependencyInsight --dependency lifecycle-viewmodel-compose --configuration debugRuntimeClasspath
        working-directory: android

      - name: Build and test
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: NEXUS web redesign preview

on:
  push:
    branches:
      - feature/nexus-redesign-v1.3.0
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/nexus-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Reconcile stale npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): reconcile NEXUS package lock"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Upload reconciled lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-web-preview-lockfile
          path: package-lock.json
          retention-days: 7

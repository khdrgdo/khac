name: NEXUS web redesign preview

on:
  push:
    branches:
      - feature/nexus-redesign-v1.3.0
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/nexus-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
